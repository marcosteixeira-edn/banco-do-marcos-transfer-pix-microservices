<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transferência PIX</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <h1>Transferência PIX</h1>
        <form id="transferForm">
            <div class="form-group">
                <label for="key">Chave PIX:</label>
                <input type="text" id="key" name="key" required placeholder="Digite a chave PIX">
            </div>
            <div class="form-group">
                <label for="amount">Valor (R$):</label>
                <input type="number" id="amount" name="amount" min="0.01" step="0.01" required placeholder="0.00">
            </div>
            <button type="submit" id="submitBtn">Transferir</button>
        </form>
        <div id="result" class="hidden"></div>
    </div>
    <script src="app.js"></script>
</body>

</html>
